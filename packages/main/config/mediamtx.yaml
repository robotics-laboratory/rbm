# https://github.com/bluenviron/mediamtx/blob/main/mediamtx.yml

rtsp: true
rtspAddress: :8554

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

rtmp: false
hls: false
srt: false

paths:
  yolo:
    source: publisher

  cam:
    source: publisher
    runOnDemand: ffmpeg -f v4l2 -input_format mjpeg -video_size 1920x1080 -framerate 30 -i /dev/video0 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1M -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
